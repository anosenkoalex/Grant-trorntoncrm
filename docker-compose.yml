version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: armico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/armico
      REDIS_URL: redis://redis:6379/0
      PORT: '3000'
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - '5173:80'
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx-conf:/etc/nginx/conf.d:ro
    restart: unless-stopped

volumes:
  postgres-data:
